<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fafafa">
    <title>timothyandkyler.devs.surf</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
        // Use each visitor's local time: day from 7 AM to 7 PM.
        function updateTheme() {
            const hour = new Date().getHours();
            const theme = hour >= 7 && hour < 19 ? 'day' : 'night';
            const previousTheme = document.documentElement.dataset.theme;
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]')
                .setAttribute('content', theme === 'day' ? '#fafafa' : '#080d19');

            if (previousTheme !== theme) {
                document.dispatchEvent(new Event('themechange'));
            }
        }

        updateTheme(); // Apply before the page renders to avoid a theme flash.
        setInterval(updateTheme, 30 * 1000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) updateTheme();
        });
    </script>
    <style>
        :root {
            color-scheme: light;
            --bg-color: #fafafa;
            --text-main: #111827;
            --text-muted: #6b7280;
            --btn-bg: #ffffff;
            --btn-border: #e5e7eb;
            --btn-hover: #f9fafb;
        }

        :root[data-theme="night"] {
            color-scheme: dark;
            --bg-color: #080d19;
            --text-main: #edf4ff;
            --text-muted: #8d9bb2;
            --btn-bg: rgba(16, 27, 45, 0.72);
            --btn-border: rgba(145, 178, 215, 0.19);
            --btn-hover: rgba(24, 42, 66, 0.86);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100svh;
            text-align: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
        }

        /* The subtle grid/glow appears only at night. */
        :root[data-theme="night"] body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse 45% 40% at 50% 43%,
                    rgba(37, 97, 159, 0.20),
                    transparent 85%
                ),
                radial-gradient(
                    circle at 88% 12%,
                    rgba(82, 55, 135, 0.10),
                    transparent 40%
                ),
                linear-gradient(
                    rgba(128, 178, 232, 0.045) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(128, 178, 232, 0.045) 1px,
                    transparent 1px
                );
            background-size: auto, auto, 42px 42px, 42px 42px;
        }

        :root[data-theme="night"] body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 24%,
                rgba(4, 8, 17, 0.56) 100%
            );
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        h1 {
            font-size: clamp(1.85rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0 0 0.5rem 0;
            color: var(--text-main);
            overflow-wrap: anywhere;
        }

        p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin: 0 0 3rem 0;
            font-weight: 400;
        }

        .button-grid {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: 0.875rem 1.75rem;
            border-radius: 99px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: #d1d5db;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 4px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .dot-friendmail {
            background-color: #3b82f6;
        }

        .dot-secret {
            background-color: #ec4899;
        }

        .dot-podcast {
            background-color: #38bdf8;
        }

        .dot-coming {
            background-color: #ddd6fe;
        }

        .btn-coming {
            color: #ffffff;
            background-color: #8b5cf6;
            border-color: #8b5cf6;
            box-shadow: 0 3px 12px rgba(139, 92, 246, 0.18);
        }

        .btn-coming:hover {
            background-color: #7c3aed;
            border-color: #7c3aed;
            box-shadow: 0 5px 18px rgba(139, 92, 246, 0.26);
        }

        .btn-coming:focus-visible {
            outline-color: #8b5cf6;
        }

        /* Night-only text glow, glass buttons, and glowing dots. */
        :root[data-theme="night"] .container {
            max-width: 680px;
        }

        :root[data-theme="night"] h1 {
            text-shadow: 0 0 38px rgba(79, 154, 244, 0.16);
        }

        :root[data-theme="night"] p {
            font-size: 1.15rem;
        }

        :root[data-theme="night"] .btn {
            padding: 0.875rem 1.55rem;
            font-size: 0.98rem;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12),
                inset 0 1px rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        :root[data-theme="night"] .btn:hover {
            border-color: rgba(119, 187, 250, 0.48);
            box-shadow:
                0 7px 24px rgba(0, 0, 0, 0.2),
                0 0 18px rgba(71, 155, 255, 0.10);
        }

        :root[data-theme="night"] .btn:focus-visible {
            outline-color: #73c9ff;
        }

        :root[data-theme="night"] .dot {
            width: 9px;
            height: 9px;
        }

        :root[data-theme="night"] .dot-friendmail {
            background-color: #559eff;
            box-shadow: 0 0 9px #559eff;
        }

        :root[data-theme="night"] .dot-secret {
            background-color: #ec71bc;
            box-shadow: 0 0 9px #ec71bc;
        }

        :root[data-theme="night"] .dot-podcast {
            background-color: #45d4f8;
            box-shadow: 0 0 9px #45d4f8;
        }

        :root[data-theme="night"] .dot-coming {
            background-color: #d8b4fe;
            box-shadow: 0 0 9px #c084fc;
        }

        :root[data-theme="night"] .btn-coming {
            color: #f6eaff;
            background: rgba(101, 53, 158, 0.65);
            border-color: rgba(196, 135, 255, 0.55);
            box-shadow: 0 5px 22px rgba(93, 47, 157, 0.22);
        }

        :root[data-theme="night"] .btn-coming:hover {
            background: rgba(123, 67, 190, 0.82);
            border-color: #c69afa;
            box-shadow: 0 7px 26px rgba(127, 68, 210, 0.30);
        }

        /* A quiet, blue terminal behind the content; night-only. */
        .terminal-bg {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            text-align: left;
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
        }

        :root[data-theme="night"] .terminal-bg {
            display: block;
        }

        .terminal-window {
            position: absolute;
            top: clamp(2.5rem, 9vh, 6.5rem);
            left: clamp(1.25rem, 5vw, 5.5rem);
            width: min(440px, calc(100vw - 2.5rem));
            height: 246px;
            border: 1px solid rgba(69, 147, 229, 0.16);
            border-radius: 10px;
            background: rgba(6, 20, 42, 0.24);
            box-shadow: 0 0 60px rgba(48, 126, 225, 0.05);
            opacity: 0.47;
            transform: rotate(-0.75deg);
        }

        .terminal-heading {
            padding: 11px 16px;
            border-bottom: 1px solid rgba(69, 147, 229, 0.16);
            color: #85bbf7;
            font-size: 0.7rem;
            letter-spacing: 0.02em;
        }

        .terminal-heading::before {
            content: "●  ●  ●";
            color: #407db9;
            margin-right: 14px;
            letter-spacing: 0.23em;
        }

        .terminal-output {
            padding: 12px 17px 20px;
            color: #7fc6ff;
            font-size: 0.78rem;
            line-height: 1.8;
            overflow: hidden;
            height: 206px;
        }

        .terminal-line {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .terminal-line.typing::after {
            content: "▌";
            color: #a5dbff;
            animation: cursorBlink 0.8s step-end infinite;
        }

        @keyframes cursorBlink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .terminal-window {
                top: 1.5rem;
                opacity: 0.33;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .btn {
                transition: none;
            }

            .terminal-line.typing::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="terminal-bg" aria-hidden="true">
        <div class="terminal-window">
            <div class="terminal-heading">tk@goatnet: ~</div>
            <div class="terminal-output" id="terminal-output"></div>
        </div>
    </div>

    <div class="container">
        <h1>timothyandkyler.devs.surf</h1>
        <p>the websight for goats</p>

        <div class="button-grid">
            <a href="/email" class="btn">
                <span class="dot dot-friendmail"></span>
                FriendMail
            </a>

            <a href="/podcast" class="btn">
                <span class="dot dot-podcast"></span>
                PodCastaway
            </a>

            <a href="/secret-webpage" class="btn">
                <span class="dot dot-secret"></span>
                Secret Room Chat
            </a>

            <a href="/3d-realistic-playground" class="btn btn-coming">
                <span class="dot dot-coming"></span>
                Coming soon...
            </a>
        </div>
    </div>

    <script>
        // Occasionally type a playful command. This only runs at night.
        (() => {
            const output = document.getElementById('terminal-output');
            const reducedMotion = window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            );

            const messages = [
                'echo timothyisthegoat',
                'echo kyleristhegoat',
                'echo nickisthegoat',
                'goat_mode --enable',
                'ping the_goat_network',
                'echo the website for goats',
                'status --all-systems-goat',
                'echo secret goat website at https://timothyandkyler.zivill.com/Exiting-thing/',
                'echo you just got',
                'echo Rickrolled',
                'echo real secret website coming soon'
            ];

            let timer = null;
            let line = null;
            let position = 0;
            let messageIndex = 0;
            let currentMessage = '';

            function canAnimate() {
                return (
                    document.documentElement.dataset.theme === 'night' &&
                    !document.hidden &&
                    !reducedMotion.matches
                );
            }

            function addLine(value = '') {
                const element = document.createElement('div');
                element.className = 'terminal-line';
                element.textContent = value;
                output.appendChild(element);

                while (output.childElementCount > 7) {
                    output.firstElementChild.remove();
                }

                return element;
            }

            function queue(callback, delay) {
                clearTimeout(timer);

                timer = setTimeout(() => {
                    timer = null;

                    if (canAnimate()) {
                        callback();
                    }
                }, delay);
            }

            function typeCharacter() {
                if (!canAnimate() || !line) return;

                line.textContent =
                    currentMessage.slice(0, ++position);

                if (position < currentMessage.length) {
                    queue(
                        typeCharacter,
                        55 + Math.random() * 65
                    );
                } else {
                    line.classList.remove('typing');
                    line = null;
                    position = 0;

                    queue(
                        beginMessage,
                        4500 + Math.random() * 4500
                    );
                }
            }

            function beginMessage() {
                if (!canAnimate()) return;

                currentMessage =
                    '$ ' + messages[messageIndex++ % messages.length];

                position = 0;
                line = addLine();
                line.classList.add('typing');

                typeCharacter();
            }

            function syncTerminal() {
                clearTimeout(timer);
                timer = null;

                if (!canAnimate()) {
                    if (line) {
                        line.classList.remove('typing');
                        line = null;
                        position = 0;
                    }

                    return;
                }

                // Resume the current partial line where it stopped.
                if (line) {
                    line.classList.add('typing');
                    queue(typeCharacter, 60);
                    return;
                }

                if (!output.childElementCount) {
                    addLine('goatnet terminal [connected]');
                    addLine('ready for commands_');
                }

                queue(beginMessage, 2300);
            }

            document.addEventListener('themechange', syncTerminal);
            document.addEventListener('visibilitychange', syncTerminal);
            reducedMotion.addEventListener('change', syncTerminal);

            syncTerminal();
        })();
    </script>
</body>
</html>
