<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d19">
    <title>timothyandkyler.devs.surf</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #080d19;
            --text-main: #edf4ff;
            --text-muted: #8d9bb2;
            --btn-bg: rgba(16, 27, 45, 0.72);
            --btn-border: rgba(145, 178, 215, 0.19);
            --btn-hover: rgba(24, 42, 66, 0.86);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100svh;
            text-align: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
        }

        /* Faint grid + soft glow: futuristic without being distracting. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(ellipse 45% 40% at 50% 43%, rgba(37, 97, 159, 0.20), transparent 85%),
                radial-gradient(circle at 88% 12%, rgba(82, 55, 135, 0.10), transparent 40%),
                linear-gradient(rgba(128, 178, 232, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 178, 232, 0.045) 1px, transparent 1px);
            background-size: auto, auto, 42px 42px, 42px 42px;
        }

        /* Gentle edge vignette adds depth to the background. */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 24%, rgba(4, 8, 17, 0.56) 100%);
        }

        .container {
            width: 100%;
            max-width: 680px;
            animation: fadeIn 0.8s ease-out both;
        }

        h1 {
            font-size: clamp(1.85rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0 0 0.65rem;
            color: var(--text-main);
            text-shadow: 0 0 38px rgba(79, 154, 244, 0.16);
            overflow-wrap: anywhere;
        }

        p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin: 0 0 2.75rem;
            font-weight: 400;
        }

        .button-grid {
            display: flex;
            gap: 0.875rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: 0.875rem 1.55rem;
            border-radius: 99px;
            text-decoration: none;
            font-size: 0.98rem;
            font-weight: 500;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12), inset 0 1px rgba(255, 255, 255, 0.035);
            display: inline-flex;
            align-items: center;
            gap: 9px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: var(--btn-hover);
            border-color: rgba(119, 187, 250, 0.48);
            transform: translateY(-2px);
            box-shadow: 0 7px 24px rgba(0, 0, 0, 0.2), 0 0 18px rgba(71, 155, 255, 0.10);
        }

        .btn:focus-visible {
            outline: 2px solid #73c9ff;
            outline-offset: 4px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            flex: 0 0 auto;
            box-shadow: 0 0 9px currentColor;
        }
        .dot-friendmail { background-color: #559eff; color: #559eff; }
        .dot-secret { background-color: #ec71bc; color: #ec71bc; }
        .dot-podcast { background-color: #45d4f8; color: #45d4f8; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .container { animation: none; }
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>timothyandkyler.devs.surf</h1>
        <p>the websight for goats</p>

        <div class="button-grid">
            <a href="/email" class="btn">
                <span class="dot dot-friendmail"></span>
                FriendMail
            </a>
            <a href="/podcast" class="btn">
                <span class="dot dot-podcast"></span>
                PodCastaway
            </a>
            <a href="/secret-webpage" class="btn">
                <span class="dot dot-secret"></span>
                Secret Room Chat
            </a>
        </div>
    </div>
</body>
</html>
